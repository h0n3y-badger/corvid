[workspace]
members = ["crates/corvid-core", "crates/corvid"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0 AND GPL-3.0-or-later"
repository = "https://github.com/h0n3y-badger/corvid"

[workspace.dependencies]
corvid-core = { path = "crates/corvid-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
notify = "8"
log = "0.4"
env_logger = "0.11"
rand = "0.9"
